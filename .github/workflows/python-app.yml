name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install CI tools
        run: python -m pip install -r requirements-ci.txt
      - name: Lint
        run: python -m flake8 --isolated src tests --select=E9,F --count --show-source --statistics
      - name: Build distributions
        run: python -m build
      - name: Install wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - name: Test installed wheel
        run: python -m pytest -q

  publish:
    name: Publish wheel to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install publishing tools
        run: python -m pip install 'build>=1.2,<2' 'twine>=6,<8'
      - name: Build wheel
        run: python -m build --wheel
      - name: Validate wheel
        run: python -m twine check --strict dist/*.whl
      - name: Upload wheel to PyPI
        env:
          TWINE_USERNAME: __token__
          # Configure this repository secret with a PyPI API token.
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*.whl
