# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pyyaml build setuptools
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        PYTHONPATH=./src pytest
    - name: Build wheel
      run: python -m build
    - name: Install wheel
      run: pip install $(ls -tr dist/*.whl | tail -1)
    - name: test wheel paynow phone
      run: paynow -a 88 -r +6599999999 -c 'split bill restaurant'
    - name: test wheel paynow UEN
      run: paynow -a 88 -r 12345678 -c 12345 -u
    - name: test wheel paynow UEN encode
      run: paynow -a 88 -r 12345678 -c 12345 -u | encode-sgqr
    - name: test wheel paynow UEN encode decode
      run: paynow -a 88 -r 12345678 -c 12345 -u -t 300 | encode-sgqr | decode-sgqr
