name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install CI tools
        run: python -m pip install -r requirements-ci.txt
      - name: Lint
        run: python -m flake8 --isolated src tests --select=E9,F --count --show-source --statistics
      - name: Build distributions
        run: python -m build
      - name: Install wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - name: Test installed wheel
        run: python -m pytest -q
      - name: Smoke test installed commands outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          paynow -a 88 -r +6599999999 -c 'split bill restaurant' | encode-sgqr | decode-sgqr
          paynow -a 88 -r 12345678 -c 12345 -u -t 300 | encode-sgqr | decode-sgqr
